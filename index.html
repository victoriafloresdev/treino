<script>try { var h = document.documentElement, t = localStorage.getItem('dayType'), m = localStorage.getItem('theme'), p = localStorage.getItem('palette');
  if (/^[ABCD]$/.test(t)) h.dataset.day = t;
  if (m === 'light' || m === 'dark') h.dataset.theme = m;
  if (/^(oceano|floresta|lavanda|grafite)$/.test(p)) h.dataset.palette = p; } catch (e) {}</script>
</head>
<body>
<header class="appbar" id="appbar">

</div>
